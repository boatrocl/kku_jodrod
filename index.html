<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#B71C1C">
    <meta name="description" content="ระบบแนะนำแหล่งที่จอดรถทางเลือกเพื่อลดความแออัดภายในมหาวิทยาลัยขอนแก่น">
    <title>KKU Parking – แนะนำที่จอดรถทางเลือก มข.</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==================== APP CONTAINER ==================== -->
    <div class="app-container">

        <!-- ==================== SIDEBAR / FLOATING PANEL ==================== -->
        <!-- บนมือถือ container นี้จะสลายตัวด้วย display: contents เพื่อให้ top-bar และ bottom-sheet อยู่หัว-ท้ายจอ -->
        <!-- บน PC container นี้จะเป็น Sidebar ซ้ายสไตล์ Google Maps แบบ Flex รวมเป็นแผงเดียว ไม่มีการซ้อนทับกัน -->
        <aside class="sidebar-panel" id="sidebar-panel">

            <!-- TOP BAR (Brand, Search, Filter Chips) -->
            <header class="top-bar">
                <div class="brand-bar">
                    <div class="brand-badge">
                        <span class="brand-icon">🅿️</span>
                        <div class="brand-info">
                            <h1 class="brand-title">KKU JodRod</h1>
                            <span class="brand-sub">แนะนำที่จอดรถทางเลือก มข.</span>
                        </div>
                    </div>
                    <div class="gps-badge" id="gps-badge" title="สถานะ GPS">
                        <span class="gps-dot"></span>
                        <span class="gps-text" id="gps-text">GPS ปิดอยู่</span>
                    </div>
                </div>

                <!-- Search Input Box -->
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="ค้นหาจุดจอด เช่น วิศวะ, วิทย์, หอสมุด..." autocomplete="off">
                    <button type="button" class="btn-clear hidden" id="btn-clear-search" aria-label="ล้างคำค้นหา">✕</button>
                </div>

                <!-- Filter Chips (Horizontal Scrollable) -->
                <nav class="filter-chips-container" aria-label="ตัวกรองจุดจอด">
                    <button class="chip active" data-filter="all">ทั้งหมด</button>
                    <button class="chip" data-filter="alternative">🟢 ทางเลือก (คนน้อย)</button>
                    <button class="chip" data-filter="main">🟡 ลานหลัก (คนเยอะ)</button>
                    <button class="chip" data-filter="nearest" id="chip-nearest">⚡ ใกล้ฉันที่สุด</button>
                </nav>
            </header>

            <!-- INTERACTIVE BOTTOM SHEET / DRAWER (PC: Card List) -->
            <section class="bottom-sheet collapsed" id="bottom-sheet" aria-label="รายการที่จอดรถ">
                
                <!-- Handle bar for touch drag/tap (Mobile only) -->
                <div class="sheet-handle-area" id="sheet-handle">
                    <div class="sheet-handle-bar"></div>
                </div>

                <!-- Sheet Header / Quick Stats -->
                <div class="sheet-header" id="sheet-header">
                    <div class="sheet-title-wrap">
                        <h2 class="sheet-title" id="sheet-title">จุดจอดรถรอบ มข.</h2>
                        <p class="sheet-status" id="sheet-status">แตะหมุดบนแผนที่ หรือเลือกจากรายการ</p>
                    </div>
                    <button class="sheet-toggle-btn" id="sheet-toggle-btn" aria-label="สลับการแสดงผล">
                        <span class="toggle-icon">▲</span>
                    </button>
                </div>

                <!-- Active Selected Spot Preview (Quick 1-Tap Navigate) -->
                <div class="selected-preview hidden" id="selected-preview">
                    <!-- เนื้อหาจะถูกแทรกอัตโนมัติเมื่อเลือกจุดจอด -->
                </div>

                <!-- Scrollable Parking Cards List -->
                <div class="sheet-content" id="sheet-content">
                    <div class="spots-summary-bar">
                        <span id="spots-count-badge" class="badge-count">พบ 6 จุด</span>
                        <span class="hint-text">คลิกเพื่อดูหมุดและนำทาง</span>
                    </div>
                    <ul id="parking-list" class="parking-list">
                        <!-- รายการจะถูกสร้างอัตโนมัติผ่าน JavaScript -->
                    </ul>
                </div>
            </section>

            <!-- SURVEY BANNER (PC Sidebar bottom) -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeJjeyUPO1HHZZ8oBQpizKfwHdQbD-J-xmWubY7yrHVzS9G1g/viewform"
               target="_blank" rel="noopener noreferrer"
               class="survey-banner-btn" id="survey-banner-btn"
               aria-label="แบบสอบถามความพึงพอใจ">
                <span class="survey-banner-icon">📋</span>
                <div class="survey-banner-text">
                    <span class="survey-banner-title">แบบสอบถามความพึงพอใจ</span>
                    <span class="survey-banner-sub">ช่วยเราพัฒนาระบบให้ดียิ่งขึ้น ✨</span>
                </div>
                <span class="survey-banner-arrow">→</span>
            </a>

        </aside>

        <!-- ==================== FULLSCREEN MAP ==================== -->
        <main class="map-viewport" id="map-viewport">
            <div id="map"></div>

            <!-- Floating Action Buttons (FABs) -->
            <div class="fab-group" aria-label="ปุ่มควบคุมแผนที่">
                <button class="fab-btn fab-locate" id="fab-locate" onclick="locateUser()" title="ตำแหน่งของฉัน" aria-label="ระบุตำแหน่งของฉัน">
                    <span class="fab-icon">📍</span>
                    <span class="pulse-ring"></span>
                </button>
                <button class="fab-btn" id="fab-recenter" onclick="resetMapCenter()" title="กลับใจกลาง มข." aria-label="กลับสู่ใจกลางมหาวิทยาลัย">
                    <span class="fab-icon">🎯</span>
                </button>
                <button class="fab-btn fab-nearest hidden" id="fab-nearest" onclick="selectNearestSpot()" title="นำทางจุดที่ใกล้ที่สุด" aria-label="ไปยังจุดที่ใกล้ที่สุด">
                    <span class="fab-icon">⚡</span>
                </button>
                <!-- Survey FAB (Mobile only) -->
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSeJjeyUPO1HHZZ8oBQpizKfwHdQbD-J-xmWubY7yrHVzS9G1g/viewform"
                   target="_blank" rel="noopener noreferrer"
                   class="fab-btn fab-survey" id="fab-survey"
                   title="แบบสอบถามความพึงพอใจ" aria-label="ทำแบบสอบถามความพึงพอใจ">
                    <span class="fab-icon">📋</span>
                    <span class="survey-pulse-ring"></span>
                </a>
            </div>
        </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
